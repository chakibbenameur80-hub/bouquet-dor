<style>
:root{--ink:#1F2A44;--gold:#C8A23A;--sky:#DCEBFF;--mint:#D8F3E4;--blush:#FFE1E6;--butter:#FFF1B8;--bg:#FBFCFF}
body{font-family:Cairo,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3,.f{font-family:Fredoka,Cairo,sans-serif}
.in{width:100%;border:1.5px solid #dfe6f3;border-radius:14px;padding:.7rem .9rem;background:#fff;outline:none;font-size:16px}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px #c8a23a30}
.btn{background:var(--ink);color:#fff;border-radius:16px;padding:.8rem 1.3rem;font-weight:700;display:inline-flex;gap:.5rem;align-items:center;justify-content:center;transition:.2s}
.btn:hover{background:#2d3b5e}.btn:active{transform:scale(.97)}
.gold{background:linear-gradient(135deg,#e2c25e,#b8901c);color:#fff}
.gold:hover{background:linear-gradient(135deg,#d4b24d,#a67f12)}
.chip{border:1.5px solid #dfe6f3;border-radius:999px;padding:.2rem .7rem;font-size:.8rem}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 2px 14px #1f2a4410;transition:.25s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px #1f2a4418}
.sheet{animation:up .3s ease both}@keyframes up{from{transform:translateY(40px);opacity:0}}
.blob{position:absolute;border-radius:50%;animation:fl 7s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

 {id:3,title:"Sandales orthopédiques noir & gris",price:3500,sizes:[19,20,21,22,23,24,25,26],colors:"Noir/Gris",desc:"Sandales fermées en cuir, talon rigide et 3 scratchs pour un bon maintien.",img:ph("🩴","#DCEBFF")},
 {id:4,title:"Bottines rose étoile argentée",price:4200,sizes:[19,20,21,22,23,24,25,26],colors:"Rose",desc:"Cuir rose tendre et détail étoile argentée, 3 scratchs faciles à fermer.",img:ph("👟","#FFE1E6")},
 {id:5,title:"Baskets montantes rose & chocolat",price:4500,sizes:[20,21,22,23,24,25,26,27],colors:"Rose/Chocolat",desc:"Look sportif, semelle légère et 3 scratchs pour un enfilage rapide.",img:ph("👟","#FFF1B8")},
 {id:6,title:"Bottines marine étoiles",price:4400,sizes:[19,20,21,22,23,24,25,26],colors:"Marine",desc:"Bout verni, étoiles à l’arrière et intérieur doux pour les petits pieds.",img:ph("🥾","#DCEBFF")},
 {id:7,title:"Bottines gris & corail",price:4300,sizes:[19,20,21,22,23,24,25,26],colors:"Gris/Corail",desc:"Cuir texturé, touches corail et semelle crêpe souple.",img:ph("🥿","#D8F3E4")},
 {id:8,title:"Bottines rose poudré",price:4200,sizes:[19,20,21,22,23,24,25,26],colors:"Rose poudré",desc:"Cuir et daim rose, talon renforcé et scratchs ajustables.",img:ph("👟","#FFE1E6")}];
const S=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v??d}catch{return d}};
const save=()=>{try{localStorage.setItem('bdk2',JSON.stringify(D))}catch(e){alert("Stockage plein : utilisez des images plus légères.")}};
let D=Object.assign({p:seed(),f:defFees(),o:[],wa:""},S('bdk2',{}));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DA=n=>Number(n).toLocaleString('fr-FR')+' DA',ic=()=>window.lucide&&lucide.createIcons();
let tab='orders',cur=null;
const comp=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,700/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.75))};i.src=r.result};r.readAsDataURL(f)});

/* ========== Vitrine ========== */
function store(){
$('#app').innerHTML=`
<header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-slate-100" style="padding-top:env(safe-area-inset-top)">
 <div class="max-w-5xl mx-auto flex items-center justify-between px-4 py-3">
  <a href="#" class="flex items-center gap-2"><span class="w-9 h-9 rounded-full gold grid place-items-center f font-semibold">B</span><span class="f font-semibold leading-tight">Bouquet d’Or<br><small class="text-[11px] font-medium text-slate-500">Kouba</small></span></a>
  <a href="#catalogue" class="btn gold !py-2 !px-4 text-sm"><i data-lucide="shopping-bag" class="w-4 h-4"></i>Commander</a>
 </div></header>
<section class="relative overflow-hidden" style="background:linear-gradient(160deg,var(--sky),var(--blush) 60%,var(--butter))">
 <div class="blob w-40 h-40 bg-white/50 -top-10 -left-10"></div><div class="blob w-24 h-24 bg-[#D8F3E4] bottom-6 right-6" style="animation-delay:-3s"></div>
 <div class="relative max-w-5xl mx-auto px-5 py-14 md:py-24 grid md:grid-cols-2 gap-8 items-center">
  <div>
   <h1 class="text-4xl md:text-6xl font-semibold leading-[1.05]">Des petits pas<br>bien chaussés.</h1>
   <p class="mt-4 text-slate-600 max-w-md">Chaussures pour enfants et modèles orthopédiques confort, choisis pour le maintien, la souplesse et le plaisir de courir.</p>
   <a href="#catalogue" class="btn gold mt-6">Voir la collection<i data-lucide="arrow-down" class="w-4 h-4"></i></a>
  </div>
  <div class="grid grid-cols-2 gap-3">${D.p.slice(0,4).map((p,i)=>`<img src="${p.img}" alt="" class="rounded-3xl aspect-square object-cover shadow-lg ${i%2?'translate-y-4':''}">`).join('')}</div>
 </div></section>
<section class="max-w-5xl mx-auto px-4 -mt-5 relative grid grid-cols-1 sm:grid-cols-3 gap-3">
 ${[["truck","Livraison express","Dans les 58 wilayas"],["banknote","Paiement à la livraison","Vous payez à la réception"],["shield-check","Qualité contrôlée","Confort et solidité garantis"]].map(b=>`<div class="bg-white rounded-2xl shadow-md p-4 flex gap-3 items-center"><span class="w-10 h-10 rounded-xl bg-[var(--mint)] grid place-items-center"><i data-lucide="${b[0]}" class="w-5 h-5"></i></span><div><b class="block text-sm">${b[1]}</b><span class="text-xs text-slate-500">${b[2]}</span></div></div>`).join('')}
</section>
<main id="catalogue" class="max-w-5xl mx-auto px-4 py-12 scroll-mt-16">
 <h2 class="text-2xl md:text-3xl font-semibold mb-6">Notre collection</h2>
 ${D.p.length?`<div class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-5">${D.p.map(p=>`
 <article class="card flex flex-col"><img src="${p.img}" alt="${esc(p.title)}" loading="lazy" class="aspect-square object-cover w-full">
  <div class="p-3 flex flex-col gap-2 flex-1"><h3 class="font-semibold leading-snug text-[15px]">${esc(p.title)}</h3>
  <p class="text-xs text-slate-500 line-clamp-2">${esc(p.desc)}</p>
  <p class="text-xs text-slate-500">Pointures ${esc(p.sizes[0])}–${esc(p.sizes[p.sizes.length-1])}</p>
  <div class="mt-auto flex items-center justify-between pt-1"><b class="f text-lg" style="color:#9a7714">${DA(p.price)}</b><button onclick="openO(${p.id})" class="btn !p-2.5 !rounded-xl" aria-label="Commander"><i data-lucide="shopping-cart" class="w-4 h-4"></i></button></div></div></article>`).join('')}</div>`:`<p class="text-slate-500">La collection arrive bientôt.</p>`}
</main>
<footer class="bg-[var(--ink)] text-white/80 text-sm"><div class="max-w-5xl mx-auto px-4 py-8 flex justify-between items-center"><span class="f">Bouquet d’Or Kouba · Algérie</span><a href="#admin" class="opacity-40 hover:opacity-100" aria-label="Admin"><i data-lucide="lock" class="w-4 h-4"></i></a></div></footer>`;ic()}

/* ========== Commande ========== */
function openO(id){const p=D.p.find(x=>x.id==id);cur={p,q:1};
const cols=p.colors?p.colors.split(',').map(s=>s.trim()).filter(Boolean):[];
$('#modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/50 flex items-end md:items-center justify-center" onclick="if(event.target===this)closeO()">
<form onsubmit="sendO(event)" class="sheet bg-white w-full md:max-w-md rounded-t-3xl md:rounded-3xl max-h-[92vh] overflow-y-auto p-5 space-y-3" style="padding-bottom:calc(1.25rem + env(safe-area-inset-bottom))">
 <div class="flex gap-3 items-center"><img src="${p.img}" class="w-16 h-16 rounded-2xl object-cover"><div class="flex-1"><h3 class="font-semibold">${esc(p.title)}</h3><b style="color:#9a7714">${DA(p.price)}</b></div><button type="button" onclick="closeO()" class="p-2" aria-label="Fermer"><i data-lucide="x"></i></button></div>
 <div class="grid grid-cols-2 gap-2">
  <label class="text-xs font-semibold">Pointure<select id="o_s" class="in mt-1">${p.sizes.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label>
  <label class="text-xs font-semibold">Couleur<select id="o_c" class="in mt-1">${(cols.length?cols:['—']).map(s=>`<option>${esc(s)}</option>`).join('')}</select></label></div>
 <div class="flex items-center justify-between"><span class="text-xs font-semibold">Quantité</span><div class="flex items-center gap-3"><button type="button" onclick="qty(-1)" class="chip !px-3 text-lg">−</button><b id="o_q">1</b><button type="button" onclick="qty(1)" class="chip !px-3 text-lg">+</button></div></div>
 <input id="o_n" class="in" placeholder="Nom complet" required autocomplete="name">
 <input id="o_t" class="in" placeholder="Téléphone (05 / 06 / 07…)" inputmode="tel" required autocomplete="tel" pattern="0[567][0-9]{8}" title="Numéro algérien à 10 chiffres">
 <select id="o_w" class="in" onchange="upd()" required><option value="">Choisir la wilaya</option>${WIL.map((w,i)=>`<option value="${i}">${i+1} - ${esc(w)}</option>`).join('')}</select>
 <input id="o_a" class="in" placeholder="Commune / adresse" required autocomplete="street-address">
 <div class="rounded-2xl p-3 text-sm space-y-1" style="background:var(--sky)"><div class="flex justify-between"><span>Produits</span><b id="s_p"></b></div><div class="flex justify-between"><span>Livraison</span><b id="s_f">—</b></div><div class="flex justify-between text-base border-t border-white pt-1"><span>Total à payer</span><b id="s_t" class="f"></b></div></div>
 <button class="btn gold w-full">Confirmer la commande</button><p class="text-xs text-center text-slate-500">Paiement en espèces à la livraison.</p>
</form></div>`;upd();ic()}
function closeO(){$('#modal').innerHTML=''}
function qty(d){cur.q=Math.max(1,Math.min(20,cur.q+d));$('#o_q').textContent=cur.q;upd()}
function upd(){const w=$('#o_w').value,f=w===''?null:D.f[w],sub=cur.p.price*cur.q;
$('#s_p').textContent=DA(sub);$('#s_f').textContent=f==null?'—':DA(f);$('#s_t').textContent=DA(sub+(f||0))}
function sendO(e){e.preventDefault();const w=+$('#o_w').value,fee=D.f[w],sub=cur.p.price*cur.q;
const o={id:Date.now(),date:new Date().toISOString(),name:$('#o_n').value.trim(),phone:$('#o_t').value.trim(),wilaya:WIL[w],addr:$('#o_a').value.trim(),product:cur.p.title,size:$('#o_s').value,color:$('#o_c').value,qty:cur.q,fee,total:sub+fee,status:'pending'};
D.o.unshift(o);save();
const msg=encodeURIComponent(`Nouvelle commande — Bouquet d'Or Kouba\n${o.product} (${o.color}, pointure ${o.size}) x${o.qty}\nClient: ${o.name} · ${o.phone}\n${o.wilaya}, ${o.addr}\nTotal: ${DA(o.total)}`);
const wa=D.wa?`<a href="https://wa.me/${D.wa}?text=${msg}" target="_blank" rel="noopener" class="btn gold w-full mt-4"><i data-lucide="message-circle" class="w-4 h-4"></i>Envoyer sur WhatsApp</a>`:'';
$('#modal').innerHTML=`<div class="fixed inset-0 z-50 bg-black/50 grid place-items-center p-4"><div class="sheet bg-white rounded-3xl p-6 max-w-sm w-full text-center"><div class="w-14 h-14 rounded-full bg-[var(--mint)] grid place-items-center mx-auto"><i data-lucide="check" class="w-7 h-7"></i></div><h3 class="text-xl font-semibold mt-3">Commande reçue !</h3><p class="text-sm text-slate-600 mt-1">Merci ${esc(o.name)}. Nous vous appelons très vite pour confirmer la livraison.</p><p class="f text-lg mt-2">${DA(o.total)}</p>${wa}<button onclick="closeO()" class="btn w-full mt-2">Fermer</button></div></div>`;ic()}

/* ========== Admin ========== */
const authed=()=>sessionStorage.getItem('bdk_auth')==='1';
function admin(){
if(!authed()){$('#app').innerHTML=`<div class="min-h-screen grid place-items-center p-5" dir="rtl" style="background:var(--sky)"><form onsubmit="login(event)" class="bg-white rounded-3xl shadow-xl p-6 w-full max-w-xs space-y-3 text-center"><div class="w-12 h-12 rounded-2xl gold grid place-items-center mx-auto"><i data-lucide="lock"></i></div><h2 class="text-xl font-bold">لوحة التحكم</h2><input id="pw" type="password" class="in text-center" placeholder="كلمة المرور" inputmode="numeric" autofocus><button class="btn w-full">دخول</button><a href="#" class="text-xs text-slate-500 block">← العودة إلى المتجر</a></form></div>`;ic();return}
const pend=D.o.filter(o=>o.status=='pending').length;
const tabs=[['orders','الطلبيات','clipboard-list'],['products','المنتجات','package'],['ship','أسعار التوصيل','truck']];
$('#app').innerHTML=`<div dir="rtl" class="max-w-5xl mx-auto px-4 py-5 min-h-screen">
<div class="flex items-center justify-between mb-4"><h1 class="text-xl font-bold">لوحة التحكم · Bouquet d’Or</h1><div class="flex gap-2"><a href="#" class="chip">المتجر</a><button onclick="sessionStorage.clear();admin()" class="chip">خروج</button></div></div>
<div class="flex gap-2 mb-5 overflow-x-auto">${tabs.map(t=>`<button onclick="tab='${t[0]}';admin()" class="chip !px-4 !py-2 flex gap-2 items-center whitespace-nowrap ${tab==t[0]?'on':''}"><i data-lucide="${t[2]}" class="w-4 h-4"></i>${t[1]}${t[0]=='orders'&&pend?` <b class="bg-[var(--gold)] text-white rounded-full px-2 text-xs">${pend}</b>`:''}</button>`).join('')}</div>
${tab=='orders'?ordersV():tab=='products'?prodV():shipV()}</div>`;ic()}
function login(e){e.preventDefault();if($('#pw').value==='2026'){sessionStorage.setItem('bdk_auth','1');admin()}else{$('#pw').value='';$('#pw').placeholder='كلمة مرور خاطئة'}}
function ordersV(){if(!D.o.length)return`<div class="card p-8 text-center text-slate-500">لا توجد طلبيات بعد.</div>`;
return`<div class="card overflow-x-auto"><table class="w-full text-sm min-w-[760px]"><thead class="bg-[var(--sky)] text-right"><tr>${['التاريخ','الزبون','الهاتف','الولاية','المنتج','المقاس','المجموع','الحالة',''].map(h=>`<th class="p-3 font-semibold">${h}</th>`).join('')}</tr></thead><tbody>${D.o.map(o=>`<tr class="border-t border-slate-100"><td class="p-3 whitespace-nowrap">${new Date(o.date).toLocaleDateString('fr-FR')}</td><td class="p-3">${esc(o.name)}<div class="text-xs text-slate-500">${esc(o.addr)}</div></td><td class="p-3" dir="ltr"><a href="tel:${esc(o.phone)}" class="underline">${esc(o.phone)}</a></td><td class="p-3">${esc(o.wilaya)}</td><td class="p-3">${esc(o.product)}<div class="text-xs text-slate-500">${esc(o.color)} × ${o.qty}</div></td><td class="p-3">${esc(o.size)}</td><td class="p-3 font-bold whitespace-nowrap">${DA(o.total)}</td><td class="p-3"><select onchange="setSt(${o.id},this.value)" class="chip ${o.status=='confirmed'?'!bg-[var(--mint)]':'!bg-[var(--butter)]'}"><option value="pending" ${o.status=='pending'?'selected':''}>قيد الانتظار</option><option value="confirmed" ${o.status=='confirmed'?'selected':''}>مؤكدة</option></select></td><td class="p-3"><button onclick="delO(${o.id})" aria-label="حذف"><i data-lucide="trash-2" class="w-4 h-4 text-red-500"></i></button></td></tr>`).join('')}</tbody></table></div>`}
function setSt(id,v){D.o.find(o=>o.id==id).status=v;save();admin()}
function delO(id){if(confirm('حذف هذه الطلبية؟')){D.o=D.o.filter(o=>o.id!=id);save();admin()}}
function prodV(){return`<form onsubmit="addP(event)" class="card p-4 grid md:grid-cols-2 gap-3 mb-5">
<input id="p_t" class="in" placeholder="اسم المنتج" required><input id="p_p" class="in" type="number" min="0" placeholder="السعر (DA)" required>
<input id="p_s" class="in" placeholder="المقاسات: 24,25,26,27" required><input id="p_c" class="in" placeholder="الألوان: أبيض, وردي">
<textarea id="p_d" class="in md:col-span-2" rows="2" placeholder="الوصف"></textarea>
<label class="md:col-span-2 border-2 border-dashed rounded-2xl p-4 text-center text-sm cursor-pointer" style="border-color:var(--gold)"><i data-lucide="image-plus" class="inline w-5 h-5 ml-1"></i><span id="p_fn">اختر صورة من الهاتف أو الحاسوب</span><input id="p_i" type="file" accept="image/*" class="hidden" onchange="$('#p_fn').textContent=this.files[0]?.name||''"></label>
<button class="btn gold md:col-span-2">إضافة المنتج</button></form>
<div class="grid grid-cols-2 md:grid-cols-4 gap-3">${D.p.map(p=>`<div class="card"><img src="${p.img}" class="aspect-square object-cover w-full"><div class="p-3 text-sm"><b>${esc(p.title)}</b><div>${DA(p.price)}</div><div class="flex gap-3 mt-2"><button onclick="editPrice(${p.id})" class="text-xs underline">السعر</button><button onclick="delP(${p.id})" class="text-xs text-red-500 underline">حذف</button></div></div></div>`).join('')}</div>`}
async function addP(e){e.preventDefault();const f=$('#p_i').files[0],n=D.p.reduce((m,p)=>Math.max(m,p.id),0)+1;
D.p.push({id:n,title:$('#p_t').value.trim(),price:+$('#p_p').value,sizes:$('#p_s').value.split(',').map(s=>s.trim()).filter(Boolean),colors:$('#p_c').value,desc:$('#p_d').value,img:f?await comp(f):ph('👟','#DCEBFF')});save();admin()}
function delP(id){if(confirm('حذف المنتج؟')){D.p=D.p.filter(p=>p.id!=id);save();admin()}}
function editPrice(id){const p=D.p.find(x=>x.id==id),v=prompt('السعر الجديد (DA)',p.price);if(v&&+v>0){p.price=+v;save();admin()}}
function shipV(){return`<div class="card p-4 mb-4"><label class="text-sm font-semibold">رقم واتساب لاستقبال الطلبيات (اختياري، بصيغة دولية بدون +)<input id="wa" class="in mt-1" dir="ltr" placeholder="213550123456" value="${esc(D.wa)}"></label></div>
<div class="card p-4"><div class="flex flex-wrap gap-2 items-center mb-3"><span class="text-sm font-semibold">تعيين سعر موحّد:</span><input id="all" type="number" class="in !w-28" placeholder="DA"><button type="button" class="chip" onclick="document.querySelectorAll('.fee').forEach(i=>i.value=$('#all').value||i.value)">تطبيق على الكل</button></div>
<div class="grid grid-cols-2 md:grid-cols-3 gap-2">${WIL.map((w,i)=>`<label class="flex items-center gap-2 text-sm"><span class="flex-1">${i+1} - ${esc(w)}</span><input class="fee in !w-24 !py-1.5" type="number" min="0" value="${D.f[i]}"></label>`).join('')}</div>
<button onclick="saveF()" class="btn gold w-full mt-4">حفظ الأسعار</button></div>`}
function saveF(){D.f=[...document.querySelectorAll('.fee')].map(i=>Math.max(0,+i.value||0));D.wa=$('#wa').value.replace(/\D/g,'');save();alert('تم الحفظ ✓')}

/* ========== Routage ========== */
function route(){location.hash==='#admin'?admin():(location.hash==='#catalogue'&&$('#catalogue')?0:store());scrollTo(0,0)}
addEventListener('hashchange',()=>{if(location.hash==='#catalogue')return;route()});route();
</script>
</body>
</html>
